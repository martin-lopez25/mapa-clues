# Configuración de Servidor Spring Boot
server.port=8080
server.servlet.context-path=/

# Configuración H2 Database para pruebas y demostración inmediata
spring.datasource.url=jdbc:h2:mem:saluddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 para inspeccionar registros geográficos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Carga de datos iniciales oficiales
spring.sql.init.mode=always

